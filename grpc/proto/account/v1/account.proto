syntax = "proto3";

package account.v1;

service AccountService {
  rpc ListProgramAccounts(ListProgramAccountsRequest) returns (stream Account) {}
}

message RpcContextConfig {
  enum Commitment {
    COMMITMENT_UNSPECIFIED = 0;
    COMMITMENT_PROCESSED = 1;
    COMMITMENT_CONFIRMED = 2;
    COMMITMENT_FINALIZED = 3;
  }

  optional Commitment commitment = 1;
  optional uint64 min_context_slot = 2;
}

message Account {
  bytes pubkey = 1;
  uint64 slot = 2;
  uint64 lamports = 3;
  bytes data = 4;
  bytes owner = 5;
  bool executable = 6;
  uint64 rent_epoch = 7;
}

message ListProgramAccountsRequest {
  RpcContextConfig config = 1;
  string program_id = 2;
  repeated bytes discriminators = 3;
}
